<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backtest — Intraday Momentum</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  html, body { margin:0; padding:0; background:#11141A; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

const COLORS = {
  bg: '#11141A', panel: '#171B23', panelAlt: '#1D2230', border: '#262C39',
  text: '#ECE9E2', muted: '#8B91A0', accent: '#E8A33D', bull: '#3FCB91', bear: '#E2596B',
};

/* ----- math / strategy engine (same rules as the live dashboard) ----- */
function sma(values, length) {
  const out = new Array(values.length).fill(null);
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= length) sum -= values[i - length];
    if (i >= length - 1) out[i] = sum / length;
  }
  return out;
}
function ema(values, length) {
  const out = new Array(values.length).fill(null);
  const k = 2 / (length + 1);
  let prev = null;
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (v == null) { out[i] = prev; continue; }
    prev = prev == null ? v : v * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}
function macdLineOf(closes, fast = 12, slow = 26) {
  const f = ema(closes, fast), s = ema(closes, slow);
  return closes.map((_, i) => (f[i] != null && s[i] != null) ? f[i] - s[i] : null);
}
function trueRangeSeries(candles) {
  const tr = new Array(candles.length).fill(null);
  for (let i = 0; i < candles.length; i++) {
    if (i === 0) { tr[i] = candles[i].high - candles[i].low; continue; }
    const c = candles[i], pc = candles[i - 1].close;
    tr[i] = Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  }
  return tr;
}
function atrSeries(candles, length) { return sma(trueRangeSeries(candles), length); }

function buildAnalysis(candles, mode, sub, useMacdFilter, cooldownMs) {
  const closes = candles.map(c => c.close);
  let seriesA, seriesB;
  if (mode === 'dual') { seriesA = sma(closes, sub.fast); seriesB = sma(closes, sub.slow); }
  else { seriesA = closes; seriesB = sma(closes, sub.length); }
  const macdLine = macdLineOf(closes);
  const signals = new Array(candles.length).fill(null);
  let lastTime = -Infinity;
  for (let i = 1; i < candles.length; i++) {
    if ([seriesA[i - 1], seriesB[i - 1], seriesA[i], seriesB[i]].some(v => v == null)) continue;
    const up = seriesA[i - 1] <= seriesB[i - 1] && seriesA[i] > seriesB[i];
    const down = seriesA[i - 1] >= seriesB[i - 1] && seriesA[i] < seriesB[i];
    const filterUp = useMacdFilter ? (macdLine[i] != null && macdLine[i] > 0) : true;
    const filterDown = useMacdFilter ? (macdLine[i] != null && macdLine[i] < 0) : true;
    const timeOk = (candles[i].time - lastTime) >= cooldownMs;
    if (up && filterUp && timeOk) { signals[i] = 'up'; lastTime = candles[i].time; }
    else if (down && filterDown && timeOk) { signals[i] = 'down'; lastTime = candles[i].time; }
  }
  const regime = new Array(candles.length).fill(null);
  let cur = null;
  for (let i = 0; i < candles.length; i++) {
    if (signals[i] === 'up') cur = 'bullish'; else if (signals[i] === 'down') cur = 'bearish';
    regime[i] = cur;
  }
  return { signals, regime };
}

function gateEntries(candles1m, signals1m, candles1h, regime1h) {
  const closesByTime = candles1h.map((c, i) => ({ closeTime: c.closeTime, regime: regime1h[i] }));
  function regimeAt(time) {
    let result = null;
    for (let i = 0; i < closesByTime.length; i++) {
      if (closesByTime[i].closeTime <= time) result = closesByTime[i].regime; else break;
    }
    return result;
  }
  const entries = [];
  for (let i = 0; i < candles1m.length; i++) {
    if (signals1m[i] === 'up' && regimeAt(candles1m[i].time) === 'bullish') entries.push({ index: i, type: 'long' });
    else if (signals1m[i] === 'down' && regimeAt(candles1m[i].time) === 'bearish') entries.push({ index: i, type: 'short' });
  }
  return entries;
}

function swingExtreme(candles, idx, lookback, type) {
  const start = Math.max(0, idx - lookback);
  let val = type === 'low' ? Infinity : -Infinity;
  for (let j = start; j < idx; j++) val = type === 'low' ? Math.min(val, candles[j].low) : Math.max(val, candles[j].high);
  return val === Infinity || val === -Infinity ? candles[idx].close : val;
}
function findSrZone(candles, uptoIdx, lookback, tolerancePct, minTouches, type) {
  const start = Math.max(0, uptoIdx - lookback);
  const vals = [];
  for (let j = start; j < uptoIdx; j++) vals.push(type === 'low' ? candles[j].low : candles[j].high);
  if (vals.length === 0) return null;
  const sorted = [...vals].sort((a, b) => a - b);
  let best = null;
  for (let i = 0; i < sorted.length; i++) {
    const base = sorted[i], tol = base * (tolerancePct / 100);
    const cluster = sorted.filter(v => Math.abs(v - base) <= tol);
    if (cluster.length >= minTouches && (!best || cluster.length > best.length)) best = cluster;
  }
  return best ? (type === 'low' ? Math.min(...best) : Math.max(...best)) : null;
}

function simulateTrades(candles1m, candles1h, entries, exitCfg) {
  const atr1h = atrSeries(candles1h, exitCfg.atrLength);
  function closedIndexAt(time) {
    let result = -1;
    for (let i = 0; i < candles1h.length; i++) { if (candles1h[i].closeTime <= time) result = i; else break; }
    return result;
  }
  const entryAtIndex = new Map(entries.map(e => [e.index, e]));
  const trades = [];
  let pos = null;
  for (let i = 0; i < candles1m.length; i++) {
    const e = entryAtIndex.get(i);
    if (e && !pos) {
      const entryPrice = candles1m[i].close;
      const h1Idx = closedIndexAt(candles1m[i].time);
      const uptoIdx = h1Idx + 1;
      const type = e.type === 'long' ? 'low' : 'high';
      let level = findSrZone(candles1h, uptoIdx, exitCfg.srLookbackBars, exitCfg.srTolerancePct, exitCfg.srMinTouches, type);
      if (level == null) level = swingExtreme(candles1h, uptoIdx, exitCfg.srLookbackBars, type);
      const a = (h1Idx >= 0 && atr1h[h1Idx] != null) ? atr1h[h1Idx] : 0;
      const stopPrice = e.type === 'long' ? level - exitCfg.atrMultiplier * a : level + exitCfg.atrMultiplier * a;
      pos = { type: e.type, entryIndex: i, entryTime: candles1m[i].time, entryPrice, stopPrice, peak: entryPrice, activated: false };
      continue;
    }
    if (pos) {
      const c = candles1m[i];
      const isLong = pos.type === 'long';
      pos.peak = isLong ? Math.max(pos.peak, c.high) : Math.min(pos.peak, c.low);
      if (!pos.activated) {
        const activationPrice = isLong ? pos.entryPrice * (1 + exitCfg.activationPct / 100) : pos.entryPrice * (1 - exitCfg.activationPct / 100);
        if (isLong ? pos.peak >= activationPrice : pos.peak <= activationPrice) pos.activated = true;
      }
      const effectiveStop = pos.activated
        ? (isLong ? pos.peak * (1 - exitCfg.trailPct / 100) : pos.peak * (1 + exitCfg.trailPct / 100))
        : pos.stopPrice;
      const hit = isLong ? c.low <= effectiveStop : c.high >= effectiveStop;
      if (hit) {
        const exitPrice = effectiveStop;
        const pnlPct = isLong ? (exitPrice - pos.entryPrice) / pos.entryPrice * 100 : (pos.entryPrice - exitPrice) / pos.entryPrice * 100;
        trades.push({ ...pos, exitIndex: i, exitTime: c.time, exitPrice, pnlPct, reason: pos.activated ? 'trailing' : 'stop' });
        pos = null;
      }
    }
  }
  return trades;
}

function computeMetrics(trades) {
  if (!trades.length) return null;
  const wins = trades.filter(t => t.pnlPct > 0);
  const losses = trades.filter(t => t.pnlPct <= 0);
  const grossWin = wins.reduce((s, t) => s + t.pnlPct, 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnlPct, 0));
  let equity = 0, peak = 0, maxDD = 0;
  const curve = [0];
  trades.forEach(t => {
    equity += t.pnlPct;
    curve.push(equity);
    if (equity > peak) peak = equity;
    maxDD = Math.max(maxDD, peak - equity);
  });
  return {
    count: trades.length,
    winRate: wins.length / trades.length * 100,
    avgWin: wins.length ? grossWin / wins.length : 0,
    avgLoss: losses.length ? -grossLoss / losses.length : 0,
    expectancy: trades.reduce((s, t) => s + t.pnlPct, 0) / trades.length,
    profitFactor: grossLoss > 0 ? grossWin / grossLoss : Infinity,
    totalPnl: equity,
    maxDD,
    curve,
  };
}

/* ----- data fetching (paginated for long 1m history) ----- */
async function fetchKlinesPaged(symbol, interval, startTime, endTime, onProgress) {
  let all = [];
  let curEnd = endTime;
  let batches = 0;
  while (curEnd > startTime) {
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&endTime=${curEnd}&limit=1000`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Binance fetch failed (${res.status})`);
    const raw = await res.json();
    if (!raw.length) break;
    const batch = raw.map(k => ({ time: k[0], open: +k[1], high: +k[2], low: +k[3], close: +k[4], closeTime: k[6] }));
    all = batch.concat(all);
    batches++;
    if (onProgress) onProgress(batches, interval);
    if (batch[0].time <= startTime) break;
    curEnd = batch[0].time - 1;
    await new Promise(r => setTimeout(r, 120));
  }
  return all.filter(c => c.time >= startTime && c.time <= endTime);
}

/* ----- small equity-curve line chart ----- */
function EquityCurve({ curve }) {
  if (!curve || curve.length < 2) return null;
  const width = 1000, height = 220, pad = { top: 14, right: 14, bottom: 14, left: 46 };
  const innerW = width - pad.left - pad.right, innerH = height - pad.top - pad.bottom;
  const minV = Math.min(...curve), maxV = Math.max(...curve);
  const span = (maxV - minV) || 1;
  const xAt = i => pad.left + (i / (curve.length - 1)) * innerW;
  const yAt = v => pad.top + (1 - (v - minV) / span) * innerH;
  const last = curve[curve.length - 1];
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height, display: 'block' }}>
      <line x1={pad.left} x2={width - pad.right} y1={yAt(0)} y2={yAt(0)} stroke={COLORS.border} strokeWidth={1} />
      <text x={4} y={yAt(0) + 3} fontSize="10" fill={COLORS.muted} fontFamily="JetBrains Mono, monospace">0%</text>
      <text x={4} y={yAt(maxV) + 3} fontSize="10" fill={COLORS.muted} fontFamily="JetBrains Mono, monospace">{maxV.toFixed(1)}%</text>
      <text x={4} y={yAt(minV) + 3} fontSize="10" fill={COLORS.muted} fontFamily="JetBrains Mono, monospace">{minV.toFixed(1)}%</text>
      <polyline fill="none" stroke={last >= 0 ? COLORS.bull : COLORS.bear} strokeWidth={1.8}
        points={curve.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ')} />
    </svg>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, minWidth: 140 }}>
      <span style={{ fontSize: 11, color: COLORS.muted, textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</span>
      {children}
    </div>
  );
}
function NumberInput({ label, value, onChange }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <span style={{ fontSize: 10, color: COLORS.muted }}>{label}</span>
      <input type="number" value={value} onChange={e => onChange(Number(e.target.value))}
        style={{ background: COLORS.panelAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, borderRadius: 6, padding: '6px 8px', fontSize: 13, width: 64 }} />
    </div>
  );
}
function Stat({ label, value, color }) {
  return (
    <div>
      <div style={{ fontSize: 10, color: COLORS.muted, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</div>
      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 18, fontWeight: 600, color: color || COLORS.text }}>{value}</div>
    </div>
  );
}

function Backtest() {
  const [symbol, setSymbol] = useState('BTCUSDT');
  const [lookbackDays, setLookbackDays] = useState(7);
  const [mode] = useState('single');
  const [useMacdFilter] = useState(true);
  const [h1, setH1] = useState({ length: 200, cooldownHours: 6 });
  const [m1, setM1] = useState({ length: 200, cooldownMinutes: 0 });
  const [exitCfg, setExitCfg] = useState({ activationPct: 1.33, trailPct: 0.25, srLookbackBars: 50, srTolerancePct: 0.15, srMinTouches: 4, atrLength: 14, atrMultiplier: 0.5 });

  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState(null);
  const [results, setResults] = useState(null);

  const run = async () => {
    setRunning(true); setError(null); setResults(null);
    try {
      const endTime = Date.now();
      const startTime = endTime - lookbackDays * 24 * 3600 * 1000;
      setProgress('Descargando velas de 1H…');
      const candles1h = await fetchKlinesPaged(symbol, '1h', startTime, endTime, (n) => setProgress(`Descargando velas de 1H… lote ${n}`));
      setProgress('Descargando velas de 1M (puede tardar según el rango)…');
      const candles1m = await fetchKlinesPaged(symbol, '1m', startTime, endTime, (n) => setProgress(`Descargando velas de 1M… lote ${n}`));
      setProgress('Calculando señales y simulando trades…');
      const analysis1h = buildAnalysis(candles1h, mode, h1, useMacdFilter, h1.cooldownHours * 3600000);
      const analysis1m = buildAnalysis(candles1m, mode, m1, useMacdFilter, m1.cooldownMinutes * 60000);
      const entries = gateEntries(candles1m, analysis1m.signals, candles1h, analysis1h.regime);
      const trades = simulateTrades(candles1m, candles1h, entries, exitCfg);
      const metrics = computeMetrics(trades);
      setResults({
        trades, metrics,
        candles1mCount: candles1m.length, candles1hCount: candles1h.length,
        rangeStart: candles1m[0]?.time, rangeEnd: candles1m[candles1m.length - 1]?.time,
      });
    } catch (err) {
      setError(err.message || 'Error desconocido');
    } finally {
      setRunning(false);
    }
  };

  const fmtDate = (ms) => ms ? new Date(ms).toLocaleString() : '—';

  return (
    <div style={{ background: COLORS.bg, color: COLORS.text, fontFamily: "Inter, -apple-system, sans-serif", minHeight: '100vh', padding: '20px' }}>
      <div style={{ fontSize: 11, letterSpacing: '0.12em', color: COLORS.muted, textTransform: 'uppercase' }}>Backtest</div>
      <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 16 }}>Intraday Momentum — datos históricos reales</div>

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 16, marginBottom: 16, display: 'flex', flexWrap: 'wrap', gap: 20, alignItems: 'flex-end' }}>
        <Field label="Symbol">
          <input value={symbol} onChange={e => setSymbol(e.target.value.toUpperCase())}
            style={{ background: COLORS.panelAlt, border: `1px solid ${COLORS.border}`, color: COLORS.text, borderRadius: 6, padding: '6px 8px', fontSize: 13 }} />
        </Field>
        <NumberInput label="Días hacia atrás" value={lookbackDays} onChange={setLookbackDays} />
        <NumberInput label="Cooldown 1H (h)" value={h1.cooldownHours} onChange={v => setH1({ ...h1, cooldownHours: v })} />
        <NumberInput label="SR lookback (1H)" value={exitCfg.srLookbackBars} onChange={v => setExitCfg({ ...exitCfg, srLookbackBars: v })} />
        <NumberInput label="SR tolerancia %" value={exitCfg.srTolerancePct} onChange={v => setExitCfg({ ...exitCfg, srTolerancePct: v })} />
        <NumberInput label="Min touches" value={exitCfg.srMinTouches} onChange={v => setExitCfg({ ...exitCfg, srMinTouches: v })} />
        <NumberInput label="ATR ×" value={exitCfg.atrMultiplier} onChange={v => setExitCfg({ ...exitCfg, atrMultiplier: v })} />
        <NumberInput label="Trail activate %" value={exitCfg.activationPct} onChange={v => setExitCfg({ ...exitCfg, activationPct: v })} />
        <NumberInput label="Trail %" value={exitCfg.trailPct} onChange={v => setExitCfg({ ...exitCfg, trailPct: v })} />
        <button onClick={run} disabled={running}
          style={{ background: COLORS.accent, color: '#1A1505', border: 'none', borderRadius: 8, padding: '9px 16px', fontWeight: 700, cursor: running ? 'default' : 'pointer', opacity: running ? 0.6 : 1 }}>
          {running ? 'Corriendo…' : 'Ejecutar backtest'}
        </button>
      </div>

      {progress && running && (
        <div style={{ color: COLORS.muted, fontSize: 13, marginBottom: 14 }}>{progress}</div>
      )}
      {error && (
        <div style={{ background: 'rgba(226,89,107,0.14)', border: `1px solid ${COLORS.bear}`, color: COLORS.bear, padding: '10px 12px', borderRadius: 8, fontSize: 13, marginBottom: 14 }}>
          {error}
        </div>
      )}

      {results && (
        <>
          <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 12 }}>
            Rango cubierto: {fmtDate(results.rangeStart)} → {fmtDate(results.rangeEnd)} · {results.candles1mCount.toLocaleString()} velas de 1m · {results.candles1hCount.toLocaleString()} velas de 1h
          </div>

          {!results.metrics ? (
            <div style={{ color: COLORS.muted, fontSize: 13 }}>No se generaron entradas en este rango con la configuración actual.</div>
          ) : (
            <>
              <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 16, marginBottom: 16, display: 'flex', flexWrap: 'wrap', gap: 24 }}>
                <Stat label="Trades" value={results.metrics.count} />
                <Stat label="Win rate" value={`${results.metrics.winRate.toFixed(0)}%`} color={results.metrics.winRate >= 50 ? COLORS.bull : COLORS.bear} />
                <Stat label="Profit factor" value={results.metrics.profitFactor === Infinity ? '∞' : results.metrics.profitFactor.toFixed(2)} color={results.metrics.profitFactor >= 1.2 ? COLORS.bull : COLORS.bear} />
                <Stat label="Avg win" value={`+${results.metrics.avgWin.toFixed(2)}%`} color={COLORS.bull} />
                <Stat label="Avg loss" value={`${results.metrics.avgLoss.toFixed(2)}%`} color={COLORS.bear} />
                <Stat label="Expectancy/trade" value={`${results.metrics.expectancy >= 0 ? '+' : ''}${results.metrics.expectancy.toFixed(2)}%`} color={results.metrics.expectancy >= 0 ? COLORS.bull : COLORS.bear} />
                <Stat label="Retorno total (simple)" value={`${results.metrics.totalPnl >= 0 ? '+' : ''}${results.metrics.totalPnl.toFixed(1)}%`} color={results.metrics.totalPnl >= 0 ? COLORS.bull : COLORS.bear} />
                <Stat label="Max drawdown" value={`-${results.metrics.maxDD.toFixed(1)}%`} color={COLORS.bear} />
              </div>
              <div style={{ fontSize: 11, color: COLORS.muted, marginBottom: 8 }}>
                Nota: "retorno simple" suma el % de cada trade sin reinvertir — no es una curva de capital compuesta. Sirve para comparar configuraciones entre sí, no como proyección de ganancia real.
              </div>

              <Panel title="Curva de equity (acumulado simple)">
                <EquityCurve curve={results.metrics.curve} />
              </Panel>

              <Panel title={`Trades (mostrando los últimos ${Math.min(50, results.trades.length)} de ${results.trades.length})`}>
                <div style={{ maxHeight: 320, overflowY: 'auto' }}>
                  <table style={{ width: '100%', fontSize: 12, borderCollapse: 'collapse' }}>
                    <thead>
                      <tr style={{ color: COLORS.muted, textAlign: 'left' }}>
                        <th style={{ padding: '4px 8px' }}>Entrada</th>
                        <th style={{ padding: '4px 8px' }}>Tipo</th>
                        <th style={{ padding: '4px 8px' }}>Precio entrada</th>
                        <th style={{ padding: '4px 8px' }}>Precio salida</th>
                        <th style={{ padding: '4px 8px' }}>P&L</th>
                        <th style={{ padding: '4px 8px' }}>Razón</th>
                      </tr>
                    </thead>
                    <tbody>
                      {results.trades.slice(-50).reverse().map((t, i) => (
                        <tr key={i} style={{ borderTop: `1px solid ${COLORS.border}` }}>
                          <td style={{ padding: '4px 8px', fontFamily: 'JetBrains Mono, monospace' }}>{fmtDate(t.entryTime)}</td>
                          <td style={{ padding: '4px 8px', color: t.type === 'long' ? COLORS.bull : COLORS.bear }}>{t.type === 'long' ? 'LONG' : 'SHORT'}</td>
                          <td style={{ padding: '4px 8px', fontFamily: 'JetBrains Mono, monospace' }}>{t.entryPrice.toFixed(1)}</td>
                          <td style={{ padding: '4px 8px', fontFamily: 'JetBrains Mono, monospace' }}>{t.exitPrice.toFixed(1)}</td>
                          <td style={{ padding: '4px 8px', fontFamily: 'JetBrains Mono, monospace', color: t.pnlPct >= 0 ? COLORS.bull : COLORS.bear }}>{t.pnlPct >= 0 ? '+' : ''}{t.pnlPct.toFixed(2)}%</td>
                          <td style={{ padding: '4px 8px', color: COLORS.muted }}>{t.reason === 'trailing' ? 'trailing TP' : 'stop'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Panel>
            </>
          )}
        </>
      )}
    </div>
  );
}

function Panel({ title, children }) {
  return (
    <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 8 }}>{title}</div>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Backtest />);
</script>
</body>
</html>
